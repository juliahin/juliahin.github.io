- id: mhdbdb
  name: {de: "Mittelhochdeutsche Begriffsdatenbank (MHDBDB)", en: "Middle High German Conceptual Database (MHDBDB)"}
  start: 2023-11
  end: present
  role: {de: "Senior Scientist (seit 11/2023, mit Unterbrechungen)", en: "Senior Scientist (since Nov 2023, with interruptions)"}
  role_short: {de: "Senior Scientist", en: "Senior Scientist"}
  institution: {de: "Fachbereich Germanistik, Universität Salzburg", en: "Department of German Studies, University of Salzburg"}
  funding: {de: "Universität Salzburg; Teilprojekte gefördert durch CLARIAH-AT (BMFWF)", en: "University of Salzburg; sub-projects funded by CLARIAH-AT (BMFWF)"}
  teaser:
    de: "Forschungsinfrastruktur zur mittelhochdeutschen Sprache und Literatur. Migration des gesamten Datenbestands von RDF zu TEI, Relaunch der Plattform, offene Daten auf GitHub und Zenodo."
    en: "Research infrastructure for Middle High German language and literature. Migration of the entire data set from RDF to TEI, platform relaunch, open data on GitHub and Zenodo."
  summary:
    de: >-
      Die MHDBDB ist eine seit 1992 aufgebaute Forschungsinfrastruktur zur mittelhochdeutschen Sprache und Literatur,
      begonnen von Horst P. Pütz (Kiel) und Klaus M. Schmidt (Bowling Green) und seit 2002 an der Universität Salzburg.
      Sie enthält 667 Texte mit Lemmatisierung, Wortartenangaben und Anbindung an ein Begriffssystem. 2024 bis 2026 wurde
      der gesamte Datenbestand von RDF nach TEI migriert. Die Daten liegen offen auf GitHub und Zenodo; die neue
      Oberfläche MHDBDB Next arbeitet ohne Datenbankserver direkt auf den TEI-Dateien, MHDBDB Graph bleibt als
      RDF-Zugang bestehen.
    en: >-
      The MHDBDB is a research infrastructure for Middle High German language and literature, started in 1992 by
      Horst P. Pütz (Kiel) and Klaus M. Schmidt (Bowling Green) and hosted at the University of Salzburg since 2002.
      It holds 667 texts with lemmatisation, part-of-speech tags and links to a concept system. Between 2024 and 2026
      the entire data set was migrated from RDF to TEI. The data is openly available on GitHub and Zenodo; the new
      interface MHDBDB Next runs on the TEI files without a database server, while MHDBDB Graph remains as the RDF access.
  contribution:
    de: "Datenmigration und Kuratierung des TEI-Bestands, User Acceptance Testing für MHDBDB Next, Projektkoordination und Drittmittelanträge, TEI-Dokumentation, XPath- und XSLT-Skripting."
    en: "Data migration and curation of the TEI corpus, user acceptance testing for MHDBDB Next, project coordination and grant applications, TEI documentation, XPath and XSLT scripting."
  links:
    - {kind: website, label: "mhdbdb.plus.ac.at", url: "https://mhdbdb.plus.ac.at/"}
    - {kind: website, label: "MHDBDB Next", url: "https://dhcraft.org/mhdbdb-tei-only/"}
    - {kind: website, label: "MHDBDB Graph", url: "https://mhdbdb.plus.ac.at/graph/"}
    - {kind: code, label: "mhdbdb-tei-only", url: "https://github.com/DigitalHumanitiesCraft/mhdbdb-tei-only"}
    - {kind: code, label: "MHDBDB-next", url: "https://github.com/Middle-High-German-Conceptual-Database/MHDBDB-next"}
    - {kind: code, label: "MHDBDB-graph", url: "https://github.com/Middle-High-German-Conceptual-Database/MHDBDB-graph"}
    - {kind: code, label: {de: "GitHub-Organisation", en: "GitHub organisation"}, url: "https://github.com/Middle-High-German-Conceptual-Database"}
    - {kind: data, label: {de: "TEI-XML-Repositorium (Zenodo)", en: "TEI-XML repository (Zenodo)"}, url: "https://doi.org/10.5281/zenodo.20627657"}
    - {kind: project, label: {de: "Universität Salzburg", en: "University of Salzburg"}, url: "https://www.plus.ac.at/mittelhochdeutsche-begriffsdatenbank/"}
    - {kind: blog, label: "MHDBDB Next: Forschen ohne Datenbankserver", url: "https://doi.org/10.58079/16jkg"}
  subprojects:
    - name: "Users First. Optimierung von User Interface, User Experience und Crowdsourcing an der Mittelhochdeutschen Begriffsdatenbank"
      start: 2024-10
      end: 2026-12
      funding: "CLARIAH-AT (BMFWF)"
      summary:
        de: "Stabilisierung von MHDBDB Graph (RDF) und Aufbau von MHDBDB Next (TEI). Nutzer:innen können Belege beitragen und automatisch erzeugte Daten prüfen. Verantwortlich: Katharina Zeppezauer-Wachauer, Julia Hintersteiner, Alan Lena van Beek."
        en: "Stabilising MHDBDB Graph (RDF) and building MHDBDB Next (TEI). Users can contribute records and check automatically generated data. Responsible: Katharina Zeppezauer-Wachauer, Julia Hintersteiner, Alan Lena van Beek."
      links:
        - {kind: project, label: "CLARIAH-AT", url: "https://clariah.at/en/projects/users-first-optimierung-von-user-interface-user-experience-und-crowdsourcing-an-der-mittelhochdeutschen-begriffsdatenbank/"}
        - {kind: website, label: {de: "Belege beitragen", en: "Contribute records"}, url: "https://dhcraft.org/mhdbdb-tei-only/hilfe-belege-beitragen.html"}
    - name: "MHDBDB goes AI. Datenaufbereitung für das OER-LLM ParzivAI"
      start: 2024-10
      end: 2026-12
      funding: "CLARIAH-AT (BMFWF)"
      summary:
        de: "Aufbereitung der MHDBDB-Daten in offenen Formaten (TEI, RDF, JSON, Plain Text) und eine offene API für Lemma-Abfragen als Material für ParzivAI, ein LLM zur Übersetzung mittelhochdeutscher Texte (Prototyp: Florian Nieser und Thomas Renkert, Heidelberg). Verantwortlich: Katharina Zeppezauer-Wachauer, Julia Hintersteiner, Alan Lena van Beek. Dazu der Hackathon „Von historischen Daten zu KI“ (Salzburg, Oktober 2025)."
        en: "Preparing the MHDBDB data in open formats (TEI, RDF, JSON, plain text) and an open API for lemma queries as material for ParzivAI, an LLM for translating Middle High German texts (prototype: Florian Nieser and Thomas Renkert, Heidelberg). Responsible: Katharina Zeppezauer-Wachauer, Julia Hintersteiner, Alan Lena van Beek. Includes the hackathon “Von historischen Daten zu KI” (Salzburg, October 2025)."
      links:
        - {kind: project, label: "CLARIAH-AT", url: "https://clariah.at/en/projects/mhdbdb-goes-ai/"}
        - {kind: code, label: "plain-txt-Texte", url: "https://github.com/Middle-High-German-Conceptual-Database/plain-txt-Texte"}
        - {kind: blog, label: {de: "Hackathon-Bericht, DH Salzburg", en: "Hackathon report, DH Salzburg"}, url: "https://dhsalzburg.hypotheses.org/6295"}

- id: wb-meets-mhdbdb
  name: {de: "WB meets MHDBDB: Die Wenzelsbibel als Pilotmodell für interoperable Editionen", en: "WB meets MHDBDB: The Wenceslas Bible as a pilot model for interoperable editions"}
  start: 2025-08
  end: 2026-12
  role: {de: "Projektleitung", en: "Principal investigator"}
  role_short: {de: "Projektleitung", en: "Principal investigator"}
  institution: {de: "Universität Salzburg", en: "University of Salzburg"}
  funding: {de: "CLARIAH-AT, Small-Scale Projects 2025 (BMFWF)", en: "CLARIAH-AT small-scale projects call 2025 (BMFWF)"}
  teaser:
    de: "CLARIAH-AT-Projekt unter meiner Leitung: Integration der Wenzelsbibel in die MHDBDB mit LLM-gestützter Lemmatisierung und POS-Tagging. Seit Mai 2026 durchsuchbar."
    en: "CLARIAH-AT project under my lead: integrating the Wenceslas Bible into the MHDBDB with LLM-assisted lemmatisation and POS tagging. Searchable since May 2026."
  summary:
    de: >-
      Integration der Wenzelsbibel, einer böhmischen Prosa-Bibelübersetzung (um 1390), in die MHDBDB. Rund 150.000
      Wörter aus fünf biblischen Büchern wurden in einer dreistufigen Pipeline aus Automatisierung, LLM-Unterstützung
      und manueller Prüfung lemmatisiert und mit Wortarten versehen; Benennungen wurden mit LOD-Vokabularen (Wikidata,
      CIDOC CRM, Iconclass) abgeglichen. Für böhmisch geprägte Schreibungen und alttschechische Glossen entstanden
      neue Lexikoneinträge. Seit Mai 2026 ist die Wenzelsbibel in der MHDBDB durchsuchbar (Sigle WZB), die
      Lemma-Abdeckung liegt bei 95,3 %. Die Pipeline ist für den Ingest weiterer Texte nachnutzbar.
    en: >-
      Integration of the Wenceslas Bible, a Bohemian prose translation of the Bible (c. 1390), into the MHDBDB.
      Around 150,000 words from five biblical books were lemmatised and POS-tagged in a three-stage pipeline of
      automation, LLM assistance and manual review; names were aligned with LOD vocabularies (Wikidata, CIDOC CRM,
      Iconclass). New lexicon entries cover Bohemian-influenced spellings and Old Czech glosses. The Wenceslas Bible
      has been searchable in the MHDBDB since May 2026 (siglum WZB) with 95.3 % lemma coverage. The pipeline can be
      reused to ingest further texts.
  links:
    - {kind: project, label: "CLARIAH-AT", url: "https://clariah.at/de/projects/wb-meets-mhdbdb/"}
    - {kind: blog, label: {de: "Projektbericht, Mittelalter-Blog", en: "Project report, Mittelalter blog"}, url: "https://doi.org/10.58079/16u1d"}
    - {kind: blog, label: {de: "DH Salzburg", en: "DH Salzburg"}, url: "https://dhsalzburg.hypotheses.org/7621"}
    - {kind: talk, label: "IMC Leeds 2026 (Zenodo)", url: "https://doi.org/10.5281/zenodo.21277766"}
    - {kind: website, label: "MHDBDB Next", url: "https://dhcraft.org/mhdbdb-tei-only/"}
    - {kind: website, label: "Wenzelsbibel Digital", url: "https://edition.onb.ac.at/context:wenbibel"}
    - {kind: code, label: "mhdbdb-tei-only", url: "https://github.com/DigitalHumanitiesCraft/mhdbdb-tei-only"}
    - {kind: code, label: "Spacy-Model-for-Middle-High-German", url: "https://github.com/Middle-High-German-Conceptual-Database/Spacy-Model-for-Middle-High-German"}

- id: wenzelsbibel
  name: {de: "Die Wenzelsbibel – Digitale Edition und Analyse", en: "The Wenceslas Bible – Digital Edition and Analysis"}
  start: 2022-02
  end: 2024-10
  period_note: {de: "neue Projektphase ab 10/2026", en: "new project phase from Oct 2026"}
  role: {de: "Wissenschaftliche Mitarbeiterin (09/2022–11/2023); Bildannotation und Python-Skripting im Rahmen der Universitätsassistenz (2024–2025)", en: "Research associate (Sep 2022–Nov 2023); image annotation and Python scripting as university assistant (2024–2025)"}
  role_short: {de: "Wissenschaftliche Mitarbeiterin", en: "Research associate"}
  institution: {de: "Fachbereich Germanistik, Universität Salzburg", en: "Department of German Studies, University of Salzburg"}
  lead: {de: "Leitung: Manfred Kern", en: "Lead: Manfred Kern"}
  funding: {de: "Land Salzburg (Projektphase 2022–2024)", en: "State of Salzburg (project phase 2022–2024)"}
  partners: {de: "Österreichische Nationalbibliothek, Österreichische Akademie der Wissenschaften, Fachbereich Informatik der Universität Salzburg", en: "Austrian National Library, Austrian Academy of Sciences, Department of Computer Science, University of Salzburg"}
  teaser:
    de: "Digitale Gesamtedition der Wenzelsbibel (Universität Salzburg und Österreichische Nationalbibliothek): Faksimile, Transkription, Lesefassung, Vulgata-Synopse und Analyse des Bildprogramms."
    en: "Complete digital edition of the Wenceslas Bible (University of Salzburg and Austrian National Library): facsimile, transcription, reading text, Vulgate synopsis and analysis of the image programme."
  summary:
    de: >-
      Digitale Gesamtedition der Wenzelsbibel, der um 1390–1400 für König Wenzel IV. angefertigten, reich illustrierten
      deutschen Bibelübersetzung aus dem Bestand der Österreichischen Nationalbibliothek: Faksimile, Transkription,
      Lesefassung und Vulgata-Synopse, dazu die Analyse des Bildprogramms und der Text-Bild-Relationen. Die Edition
      erscheint auf der Editionsplattform der Österreichischen Nationalbibliothek; Genesis bis Josua liegen seit
      September 2025 mit Transkription, Lesefassung und Synopse vor.
    en: >-
      Complete digital edition of the Wenceslas Bible, the richly illustrated German Bible translation made c. 1390–1400
      for King Wenceslas IV and held by the Austrian National Library: facsimile, transcription, reading text and
      Vulgate synopsis, plus analysis of the image programme and of text–image relations. The edition is published
      on the Austrian National Library's edition platform; Genesis to Joshua have been available with transcription,
      reading text and synopsis since September 2025.
  contribution:
    de: "Workflows zur Bildannotation, ikonographische und semantische Analyse der Text-Bild-Relationen, kontrollierte Vokabulare, Evaluation computergestützter Bildanalyse (Objekt- und Gesichtserkennung) und Iconclass-Klassifikation mit einer RAG-Pipeline."
    en: "Image annotation workflows, iconographic and semantic analysis of text–image relations, controlled vocabularies, evaluation of computer-assisted image analysis (object and face detection) and Iconclass classification with a RAG pipeline."
  links:
    - {kind: website, label: "Wenzelsbibel Digital", url: "https://edition.onb.ac.at/context:wenbibel"}
    - {kind: project, label: {de: "Fachbereich Germanistik", en: "Department of German Studies"}, url: "https://www.plus.ac.at/germanistik/forschung/foschungsprojekt-die-wenzelsbibel-digitale-edition-und-analyse/"}
    - {kind: data, label: {de: "Iconclass-Annotationen und LLM-Beschreibungen (Zenodo)", en: "Iconclass annotations and LLM descriptions (Zenodo)"}, url: "https://doi.org/10.5281/zenodo.19454449"}
    - {kind: doi, label: "Histories 6 (2026)", url: "https://doi.org/10.3390/histories6010017"}
    - {kind: code, label: "page2tei_wenzel", url: "https://github.com/Middle-High-German-Conceptual-Database/page2tei_wenzel"}
    - {kind: website, label: {de: "Digitale Editionen der ÖNB", en: "Digital editions at the ÖNB"}, url: "https://edition.onb.ac.at/"}


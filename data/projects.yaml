- id: zweig-exilbriefe
  name: {de: "ÖSZD-ExilBriefe: Stefan und Lotte Zweigs Briefe aus dem Exil", en: "ÖSZD-ExilBriefe: Stefan and Lotte Zweig's letters from exile"}
  start: 2025-01
  end: 2026-06
  role: {de: "Projektmitarbeiterin (11/2025–07/2026): Digitalisierung und Metadatenerhebung in TEI-XML", en: "Project staff (Nov 2025–Jul 2026): digitisation and metadata capture in TEI-XML"}
  role_short: {de: "Projektmitarbeiterin", en: "Project staff"}
  institution: {de: "Literaturarchiv Salzburg, Universität Salzburg", en: "Literaturarchiv Salzburg, University of Salzburg"}
  lead: {de: "Leitung: Lina Maria Zangerl", en: "Lead: Lina Maria Zangerl"}
  teaser:
    de: "Erschließung und Digitalisierung von rund 500 Briefen aus dem Nachlass von Stefan und Lotte Zweig für die Plattform Stefan Zweig digital."
    en: "Cataloguing and digitisation of around 500 letters from the estate of Stefan and Lotte Zweig for the platform Stefan Zweig digital."
  summary:
    de: >-
      Erschließung, Digitalisierung und Publikation von rund 500 Briefen aus dem Nachlass von Stefan und Lotte Zweig,
      die 2024 von den Erben an die Universität Salzburg übergeben wurden: Korrespondenz zwischen Stefan und Lotte
      Zweig, mit Familienangehörigen und mit Zeitgenossen aus den Exiljahren. Die Briefe werden mit Metadaten in die
      Plattform Stefan Zweig digital integriert, die seit 2016 den verstreuten Nachlass Zweigs rekonstruiert.
    en: >-
      Cataloguing, digitisation and publication of around 500 letters from the estate of Stefan and Lotte Zweig,
      given to the University of Salzburg by the heirs in 2024: correspondence between Stefan and Lotte Zweig, with
      family members and with contemporaries from the years in exile. The letters are integrated with metadata into
      the platform Stefan Zweig digital, which has been reconstructing Zweig's dispersed estate since 2016.
  links:
    - {kind: website, label: "Stefan Zweig digital", url: "https://stefanzweig.digital/"}
    - {kind: project, label: {de: "Universität Salzburg", en: "University of Salzburg"}, url: "https://uni-salzburg.elsevierpure.com/de/projects/digitalisierung-der-stefan-zweig-best%C3%A4nde-am-literaturarchiv-salz-3/"}

intro:
  de: >-
    Ich bin Digital-Humanities-Forscherin und Softwareentwicklerin. Ich arbeite an der
    Mittelhochdeutschen Begriffsdatenbank (MHDBDB) der Universität Salzburg und an der
    digitalen Edition der Notizbücher Peter Handkes an der Österreichischen Nationalbibliothek.
    Meine Forschung verbindet Mediävistik, Kunstgeschichte und KI-gestützte Verfahren:
    semantische Annotation historischer Sprachdaten, Text-Bild-Relationen in mittelalterlichen
    Handschriften und TEI-basierte Forschungsdateninfrastrukturen.
  en: >-
    I am a Digital Humanities researcher and software developer. I work on the Middle High
    German Conceptual Database (MHDBDB) at the University of Salzburg and on the digital
    edition of Peter Handke's notebooks at the Austrian National Library. My research
    connects medieval studies, art history and AI-assisted methods: semantic annotation of
    historical language data, text–image relations in medieval manuscripts and TEI-based
    research data infrastructures.

